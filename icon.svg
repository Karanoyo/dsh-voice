<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 话筒碗：胶囊形集音头 -->
  <rect x="11" y="6" width="14" height="14" rx="7" fill="url(#mic-bowl-grad)" />
  <!-- 话筒杆 -->
  <rect x="15" y="20" width="6" height="6" fill="url(#mic-stem-grad)" />
  <!-- 支架弧：U 形环抱 -->
  <path d="M 9 17 V 21 H 27 V 17" stroke="url(#mic-arc-grad)" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <!-- 底座 -->
  <line x1="13" y1="30" x2="23" y2="30" stroke="url(#mic-arc-grad)" stroke-width="2.6" stroke-linecap="round" />
  <defs>
    <linearGradient id="mic-bowl-grad" x1="18" y1="6" x2="18" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67C7FE" />
      <stop offset="1" stop-color="#3F77D8" />
    </linearGradient>
    <linearGradient id="mic-stem-grad" x1="18" y1="20" x2="18" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5BB0F6" />
      <stop offset="1" stop-color="#3F77D8" />
    </linearGradient>
    <linearGradient id="mic-arc-grad" x1="8" y1="17" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67C7FE" />
      <stop offset="1" stop-color="#3F77D8" />
    </linearGradient>
  </defs>
</svg>
